name: Release

on:
  push:
    branches: [main]
  # 최초 0.1.0 배포용. 릴리스 PR 없이 현재 버전을 그대로 publish 합니다.
  workflow_dispatch:

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

  publish:
    needs: release-please
    # needs 가 skip 되면 publish 도 skip 되므로 always() 로 dispatch 경로를 살려 둡니다
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing(OIDC). 저장된 npm 토큰이 없습니다
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing 은 npm 11.5.1 이상이 필요합니다
      - run: npm install -g npm@latest
      - run: npm ci
      # prepublishOnly 가 build 를 돌립니다
      - run: npm publish
