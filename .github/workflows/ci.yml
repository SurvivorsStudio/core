name: CI

on:
  pull_request:
  push:
    branches: [main]

# macOS 러너를 쓰지 않습니다. 이 패키지에 네이티브 빌드가 없습니다.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
